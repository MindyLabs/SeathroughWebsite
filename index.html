<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SeaThrough: the app blocker that floods your apps</title>
<meta name="description" content="Set limits for the apps you overuse. When time is up, the sea floods in over the app. For Android.">
<meta name="theme-color" content="#195A86">
<meta property="og:type" content="website">
<meta property="og:title" content="SeaThrough">
<meta property="og:description" content="Time’s up? The sea floods in. An app blocker for Android.">
<meta property="og:image" content="https://seathough.app/og.jpg">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<script>
// seathough.com: the short link for Instagram. Android goes straight to SeaThrough's Play page; everyone else (and anyone the
// redirect cannot move) gets the button. utm_* on this page's URL pass on to Play's install referrer (default: instagram).
var PKG = 'com.mindylabs.seathrough', Q = new URLSearchParams(location.search);
var REF = 'utm_source=' + encodeURIComponent(Q.get('utm_source') || 'instagram') + '&utm_medium=' + encodeURIComponent(Q.get('utm_medium') || 'social')
  + (Q.get('utm_campaign') ? '&utm_campaign=' + encodeURIComponent(Q.get('utm_campaign')) : '');
var PLAY = 'https://play.google.com/store/apps/details?id=' + PKG + '&referrer=' + encodeURIComponent(REF);
var ANDROID = /Android/i.test(navigator.userAgent);
// Android goes to Play's https page at once: Chrome opens the Play app from a tap, not from a redirect, and in-app browsers
// (Instagram, Facebook, TikTok) can fail on intent:// links with an error page and no button. replace(): Back skips us.
// ?stay keeps the page (to look at it on a phone).
if (ANDROID && !Q.has('stay')) location.replace(PLAY);
</script>
<style>
:root { --sea: 56vh; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: linear-gradient(#195A86 0, #22689A calc(var(--sea) * .62), #3F8FBE calc(var(--sea) * .86), #A4DAE9 var(--sea), #A4DAE9) fixed;
  color: #fff; font: 16px/1.4 Geist, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow-x: hidden;
  -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased;
}
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
main {
  position: relative; z-index: 1; max-width: 640px; margin: 0 auto; text-align: center;
  padding: max(36px, env(safe-area-inset-top)) 24px 0; display: flex; flex-direction: column; align-items: center;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 18px; letter-spacing: .01em; }
.brand img { width: 40px; height: 40px; border-radius: 12px; box-shadow: 0 6px 18px rgba(4, 30, 50, .3); }
h1 { margin: 30px 0 0; font-size: clamp(36px, 10.5vw, 56px); line-height: 1.04; letter-spacing: -.028em; font-weight: 700; }
.lead { margin: 14px 0 0; font-size: 17px; }
.fine { margin: 8px 0 0; font-size: 13px; color: #DCEBF2; }
.play {
  margin-top: 26px; display: inline-flex; align-items: center; gap: 12px; height: 60px; padding: 0 30px; border-radius: 30px;
  background: #fff; color: #0B1419; text-decoration: none; font-weight: 600; font-size: 17px;
  box-shadow: 0 12px 32px rgba(6, 40, 70, .28); transition: transform .15s;
}
.play:active { transform: scale(.97); }
.play svg { flex: none; }
</style>
</head>
<body>
<canvas id="sea" aria-hidden="true"></canvas>
<canvas id="life" aria-hidden="true"></canvas>
<main>
  <div class="brand"><img src="icon.png" alt="">SeaThrough</div>
  <h1>Time’s up?<br>The sea floods in.</h1>
  <p class="lead">Set limits for the apps you overuse.</p>
  <p class="fine">For Android · 2 apps free · No account</p>
  <a class="play" id="play" href="https://play.google.com/store/apps/details?id=com.mindylabs.seathrough">
    <svg width="18" height="20" viewBox="0 0 18 20" aria-hidden="true"><path d="M2 1.6v16.8c0 .9 1 1.4 1.7.9l13.6-8.4a1 1 0 0 0 0-1.8L3.7.7C3 .2 2 .7 2 1.6z" fill="currentColor"/></svg>
    Get it on Google Play</a>
</main>
<script>
document.getElementById('play').href = PLAY;
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---- the water: the website's shader (web/site.src.html FRAG, the app's Ocean water), side view ----
const FRAG = `precision highp float;
uniform vec2 uRes; uniform float uK, uT, uSurf, uDepth, uScroll, uAlpha, uAmp; uniform vec2 uMouse; uniform vec4 uRip[4];
float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float waves(float x) {
  float t = uT;
  return 6.0 * sin(x * 0.020 + t * 1.10) + 3.5 * sin(x * 0.037 - t * 1.55 + 1.3) + 2.0 * sin(x * 0.071 + t * 2.30 + 2.1)
       + 1.2 * sin(x * 0.130 - t * 3.10 + 0.4) + 0.6 * sin(x * 0.230 + t * 4.20 + 5.0);
}
float caustic(vec2 uv, float t) {
  vec2 p = mod(uv * 6.28318, 6.28318) - 250.0, i = p;
  float c = 1.0;
  for (int n = 0; n < 5; n++) {
    float tt = t * (1.0 - 3.5 / float(n + 1));
    i = p + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x));
    c += 1.0 / length(vec2(p.x / (sin(i.x + tt) / 0.005), p.y / (cos(i.y + tt) / 0.005)));
  }
  c = 1.17 - pow(c / 5.0, 1.4);
  return pow(abs(c), 8.0);
}
void main() {
  vec2 res = uRes / uK, fc = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y) / uK;
  float t = uT, rs = 0.0;
  for (int i = 0; i < 4; i++) {
    vec4 r = uRip[i]; float age = t - r.z;
    if (age > 0.0 && age < 4.0 && r.w > 0.0) {
      float dx = abs(fc.x - r.x);
      rs += r.w * sin(dx * 0.055 - age * 9.0) * exp(-age * 1.1) * exp(-dx * 0.004) * (1.0 - smoothstep(age * 380.0, age * 380.0 + 60.0, dx));
    }
  }
  float d = fc.y - (uSurf + (waves(fc.x) + rs) * uAmp);
  if (d < -3.0) { gl_FragColor = vec4(0.0); return; }
  float dp = max(d, 0.0), dl = min(dp, 700.0), k = clamp(uDepth + dl / 2600.0, 0.0, 1.4); // local depth capped: deepness comes from uDepth
  vec3 col = mix(vec3(0.36, 0.80, 0.88), vec3(0.09, 0.52, 0.68), smoothstep(0.0, 0.22, k));
  col = mix(col, vec3(0.03, 0.22, 0.36), smoothstep(0.18, 0.65, k));
  col = mix(col, vec3(0.008, 0.055, 0.11), smoothstep(0.6, 1.25, k));
  float light = exp(-dl / 900.0) * (1.0 - 0.8 * smoothstep(0.0, 1.0, uDepth));
  vec2 q = fc + vec2(0.0, uScroll * 0.3);
  q += vec2(sin(fc.y * 0.021 + t * 1.3) + 0.5 * sin(fc.y * 0.047 - t * 0.9), cos(fc.x * 0.018 + t * 1.1)) * 7.0;
  float ring = 0.0;
  for (int i = 0; i < 4; i++) {
    vec4 r = uRip[i]; float age = t - r.z;
    if (age > 0.0 && age < 3.0) {
      vec2 v = fc - r.xy; float dd = length(v) + 0.001;
      float g = exp(-pow((dd - age * 340.0) / 28.0, 2.0)) * exp(-age * 1.5);
      ring += g; q += v / dd * g * 16.0;
    }
  }
  float ca = caustic(q / 430.0 + vec2(t * 0.012, t * 0.005), t * 0.45);
  float cb = caustic(mat2(0.8, -0.6, 0.6, 0.8) * q / 300.0 - vec2(t * 0.01, 0.0), t * 0.37 + 3.0);
  col += vec3(0.72, 1.0, 0.97) * (ca * 0.6 + cb * 0.45) * 0.45 * light;
  float sx = fc.x + fc.y * 0.38;
  float r1 = pow(0.5 + 0.5 * sin(sx * 0.010 + t * 0.25 + 2.4 * sin(sx * 0.0037 + t * 0.11)), 7.0);
  float r2 = pow(0.5 + 0.5 * sin(sx * 0.023 - t * 0.18 + 1.7 + 1.5 * sin(sx * 0.006 - t * 0.07)), 11.0);
  col += vec3(0.75, 0.97, 1.0) * (r1 * 0.65 + r2 * 0.45) * smoothstep(0.0, 90.0, dp) * exp(-dl / 1100.0) * 0.22 * (0.25 + 0.75 * light);
  float snow = 0.0;
  for (int l = 0; l < 3; l++) {
    float fl = float(l), cell = 90.0 + fl * 55.0;
    vec2 g = (fc + vec2(t * (6.0 + fl * 3.0), -t * (9.0 + fl * 4.0) + uScroll * (0.15 + fl * 0.12))) / cell;
    vec2 id = floor(g), f = fract(g) - 0.5;
    float h = hash(id + fl * 17.0);
    vec2 o = vec2(hash(id + 3.1 + fl), hash(id + 7.7 - fl)) - 0.5;
    float sz = (0.02 + h * 0.03) * (1.0 + fl * 0.35);
    snow += (1.0 - smoothstep(0.0, sz, length(f - o * 0.7))) * (0.55 + 0.45 * sin(t * (1.0 + h * 2.0) + h * 6.28)) * step(0.35, h);
  }
  col += vec3(0.8, 0.95, 1.0) * snow * 0.32 + vec3(0.7, 0.95, 1.0) * ring * 0.22;
  col += vec3(0.85, 1.0, 1.0) * exp(-dp / 16.0) * 0.28;
  float slope = (waves(fc.x + 2.0) - waves(fc.x - 2.0)) * 0.25 * uAmp;
  col += step(0.986, hash(floor(fc / vec2(5.0, 3.0)) + floor(t * 7.0))) * exp(-dp / 22.0) * smoothstep(0.1, 0.8, abs(slope)) * 0.9;
  col *= 1.0 - 0.22 * smoothstep(0.2, 1.0, fc.y / res.y) * (0.4 + 0.6 * smoothstep(0.0, 0.5, uDepth));
  vec2 mv = fc - uMouse;
  col += vec3(0.5, 0.85, 1.0) * exp(-dot(mv, mv) / 26000.0) * 0.08 * (0.3 + light);
  col = mix(col, vec3(1.0), exp(-abs(d) * 0.8) * 0.85);
  float a = uAlpha * smoothstep(-2.5, 0.5, d);
  gl_FragColor = vec4(col * a, a);
}`;

function createSea(canvas) {
  const gl = canvas.getContext('webgl', { alpha: true, premultipliedAlpha: true, antialias: false, depth: false, stencil: false });
  if (!gl) return null;
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return gl.getShaderParameter(s, gl.COMPILE_STATUS) ? s : null; };
  const vs = sh(gl.VERTEX_SHADER, 'attribute vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }'), fs = sh(gl.FRAGMENT_SHADER, FRAG);
  if (!vs || !fs) return null;
  const pr = gl.createProgram();
  gl.attachShader(pr, vs); gl.attachShader(pr, fs); gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) return null;
  gl.useProgram(pr);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const at = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(at); gl.vertexAttribPointer(at, 2, gl.FLOAT, false, 0, 0);
  const U = {};
  for (const n of ['uRes', 'uK', 'uT', 'uSurf', 'uDepth', 'uScroll', 'uAlpha', 'uAmp', 'uMouse', 'uRip']) U[n] = gl.getUniformLocation(pr, n);
  const rip = new Float32Array(16);
  return u => {
    const w = innerWidth, h = innerHeight, k = Math.min(devicePixelRatio || 1, 2) * 0.6, W = Math.round(w * k), H = Math.round(h * k);
    if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
    gl.viewport(0, 0, W, H);
    gl.uniform2f(U.uRes, W, H); gl.uniform1f(U.uK, W / w); gl.uniform1f(U.uT, u.t); gl.uniform1f(U.uSurf, u.surf);
    gl.uniform1f(U.uDepth, 0.1); gl.uniform1f(U.uScroll, 0); gl.uniform1f(U.uAlpha, 1); gl.uniform1f(U.uAmp, u.amp);
    gl.uniform2f(U.uMouse, -1e4, -1e4);
    for (let i = 0; i < 4; i++) { const r = u.rip[i]; rip.set(r ? [r.x, r.y, r.t0, 1] : [0, 0, -99, 0], i * 4); }
    gl.uniform4fv(U.uRip, rip);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  };
}

// ---- fish: the app's own sprites (they face right), steered by waypoints at their own pace; the body bends toward the tail ----
const KINDS = [['clownfish', 1], ['yellowtang', 1], ['gramma', 0.9], ['emperor', 1.1], ['idol', 1.05], ['angel', 1], ['mandarin', 0.85]];
const IMG = {};
for (const [k] of KINDS) { IMG[k] = new Image(); IMG[k].src = `fish/${k}.webp`; }
const R = Math.random;
let fish = [], bubbles = [], rip = [];

function school(n) {
  return Array.from({ length: n }, (_, i) => {
    const [k, size] = KINDS[i % KINDS.length], near = R();
    return { k, len: Math.min(150, Math.max(64, innerWidth * 0.2)) * size * (0.7 + near * 0.45), alpha: 0.78 + near * 0.22,
      x: 0, y: 0, vx: 0, vy: 0, face: 1, tx: 0, ty: 0, next: 0, pace: 0.75 + R() * 0.5, ph: R() * 6.3, in: false, at: i * 0.35 };
  }).sort((a, b) => a.len - b.len); // small (far) first, big (near) on top
}

function steer(dt, t, box) {
  for (const f of fish) {
    if (!f.in) {
      if (t < f.at) continue;
      const left = R() < 0.5;
      Object.assign(f, { in: true, x: left ? -f.len : box.x1 + f.len, y: box.y0 + R() * (box.y1 - box.y0), vx: left ? 90 : -90, face: left ? 1 : -1, next: 0 });
    }
    if (t > f.next) { f.tx = 40 + R() * Math.max(10, box.x1 - 80); f.ty = box.y0 + R() * Math.max(10, box.y1 - box.y0); f.next = t + 4 + R() * 7; }
    const dx = f.tx - f.x, dy = f.ty - f.y, d = Math.hypot(dx, dy) || 1, sp = 42 * f.pace * Math.sqrt(f.len / 60);
    f.vx += ((dx / d) * sp - f.vx) * dt * 1.1; f.vy += ((dy / d) * sp * 0.6 - f.vy) * dt * 1.1;
    if (f.y < box.y0) f.vy += (box.y0 - f.y) * dt * 6;
    if (f.y > box.y1) f.vy -= (f.y - box.y1) * dt * 6;
    f.x += f.vx * dt; f.y += f.vy * dt;
    if (Math.abs(f.vx) > 8) f.face += (Math.sign(f.vx) - f.face) * Math.min(1, dt * 5);
    f.ph += dt * (5 + Math.abs(f.vx) / 14);
  }
}

function drawFish(c, f) {
  const im = IMG[f.k];
  if (!f.in || !im.naturalWidth) return;
  const N = 14, w = f.len, h = w * im.naturalHeight / im.naturalWidth, sw = im.naturalWidth / N, s = Math.sign(f.face) || 1;
  c.save();
  c.translate(f.x, f.y);
  c.rotate(Math.max(-0.35, Math.min(0.35, f.vy / (Math.abs(f.vx) + 30))) * s);
  c.scale(s * Math.max(0.28, Math.abs(f.face)), 1); // a turn reads as a yaw, never thinner than 0.28 (TankPainter)
  c.globalAlpha = f.alpha;
  for (let i = 0; i < N; i++) { // the tail (left) swings most, the head barely
    const u = (i + 0.5) / N, bend = Math.pow(1 - u, 1.7) * Math.sin(f.ph - u * 2.6) * h * 0.07;
    c.drawImage(im, i * sw, 0, sw + 0.5, im.naturalHeight, -w / 2 + (i * w) / N, -h / 2 + bend, w / N + 0.6, h);
  }
  c.restore();
}

function stepBubbles(dt, surf, rush) {
  if (bubbles.length < 60 && R() < dt * (rush ? 40 : 1.6)) bubbles.push({ x: R() * innerWidth, y: innerHeight + 10, r: 1.4 + R() * (rush ? 6 : 3.5), vy: -(40 + R() * 70), ph: R() * 6 });
  for (const b of bubbles) { b.vy -= dt * 22; b.y += b.vy * dt; b.x += Math.sin(b.ph += dt * 3) * 16 * dt; }
  bubbles = bubbles.filter(b => b.y > surf + b.r + 3);
}
function drawBubbles(c) {
  c.lineWidth = 1;
  for (const b of bubbles) {
    c.beginPath(); c.arc(b.x, b.y, b.r, 0, 7); c.fillStyle = 'rgba(255,255,255,.1)'; c.fill(); c.strokeStyle = 'rgba(255,255,255,.55)'; c.stroke();
    c.beginPath(); c.arc(b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.28, 0, 7); c.fillStyle = 'rgba(255,255,255,.85)'; c.fill();
  }
}

// ---- the flood: the sea rushes up from the floor to just under the words, then the school swims in ----
const seaGL = createSea(document.getElementById('sea'));
const life = document.getElementById('life'), ctx = life.getContext('2d');
let target = 0, t0 = performance.now(), last = t0;
function layout() {
  const d = Math.min(devicePixelRatio || 1, 2), h = innerHeight;
  life.width = Math.round(innerWidth * d); life.height = Math.round(h * d);
  target = Math.min(h - 150, Math.max(h * 0.46, document.querySelector('.play').getBoundingClientRect().bottom + scrollY + 40));
  document.documentElement.style.setProperty('--sea', target + 'px');
  if (!fish.length) fish = school(Math.round(Math.min(14, Math.max(6, (innerWidth * (h - target)) / 26000))));
}
layout();
addEventListener('resize', layout);

function frame(now) {
  const t = (now - t0) / 1000, dt = Math.min(0.05, (now - last) / 1000), h = innerHeight; last = now;
  const p = REDUCE ? 1 : Math.min(1, Math.max(0, (t - 0.2) / 2)), ease = 1 - Math.pow(1 - p, 3), rush = p > 0 && p < 1;
  const surf = h + 30 + (target - h - 30) * ease;
  if (p > 0.45) steer(dt, t - 1.1, { x1: innerWidth, y0: surf + 50, y1: h - 40 });
  stepBubbles(dt, surf, rush);
  rip = rip.filter(r => t - r.t0 < 4);
  if (seaGL) seaGL({ t, surf, amp: 1 + (rush ? 1.6 * (1 - p) : 0), rip });
  const d = life.width / innerWidth;
  ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.clearRect(0, 0, innerWidth, h);
  if (!seaGL) { const g = ctx.createLinearGradient(0, surf, 0, h); g.addColorStop(0, '#3FB7D0'); g.addColorStop(1, '#0B4A6E'); ctx.fillStyle = g; ctx.fillRect(0, surf, innerWidth, h - surf); }
  drawBubbles(ctx);
  for (const f of fish) drawFish(ctx, f);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// a tap in the water rings out and the fish dart away from it
addEventListener('pointerdown', e => {
  const t = (performance.now() - t0) / 1000;
  rip = [...rip.slice(-3), { x: e.clientX, y: e.clientY, t0: t }];
  for (const f of fish) {
    const dx = f.x - e.clientX, dy = f.y - e.clientY, d = Math.hypot(dx, dy) || 1;
    if (f.in && d < 260) { f.vx += (dx / d) * 480; f.vy += (dy / d) * 240; f.next = t + 1.5; }
  }
});
</script>
</body>
</html>
